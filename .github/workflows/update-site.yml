name: Update site

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "37 6 * * 1"
    # Validate live sources between publications, without committing or deploying.
    - cron: "37 6 * * 0,2-6"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh source data before publishing (otherwise use saved figures)"
        type: boolean
        default: false
      source_check_only:
        description: "Run the full live-source check without committing or deploying"
        type: boolean
        default: false

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Resolve update mode
        id: mode
        run: python scripts/workflow_mode.py >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run offline tests
        run: python -m pytest tests/ -q
      - name: Refresh source data and figures
        if: steps.mode.outputs.refresh_data == 'true'
        shell: bash
        run: |
          python scripts/refresh_data.py --check-all --report "$RUNNER_TEMP/refresh-report.json" \
            2>&1 | tee "$RUNNER_TEMP/refresh.log"
      - name: Retain live-source diagnostics
        if: always() && steps.mode.outputs.refresh_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: source-check-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/refresh-report.json
            ${{ runner.temp }}/refresh.log
          retention-days: 14
          if-no-files-found: warn
      - name: Validate refreshed results
        if: steps.mode.outputs.refresh_data == 'true'
        run: python -m pytest tests/ -q
      - name: Record refreshed publication inputs
        if: steps.mode.outputs.refresh_data == 'true' && steps.mode.outputs.publish == 'true'
        run: |
          git config user.name "hanshanley"
          git config user.email "hanshanley@users.noreply.github.com"
          git add -u
          git add data outputs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh published UK statistics and figures"
          fi
      - name: Build and check the public site
        run: python scripts/build_site.py
      - name: Publish refreshed inputs
        if: steps.mode.outputs.refresh_data == 'true' && steps.mode.outputs.publish == 'true'
        run: git push origin HEAD:master
      - name: Build redirects to The Margin of Error
        if: steps.mode.outputs.publish == 'true'
        run: python scripts/build_site.py --redirects
      - uses: actions/upload-pages-artifact@v4
        if: steps.mode.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
